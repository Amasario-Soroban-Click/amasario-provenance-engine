name: Testnet

# The live-network smoke test. It is not part of `CI`, and deliberately so: a live
# network is not deterministic, so a failure here means either that something broke or
# that testnet was reset, and nothing in the workflow can tell the two apart for you.
#
# It runs on a schedule and on demand rather than on every pull request. It *does* assert
# the analysis: `scripts/test-testnet.sh` checks the documents the commands produce for
# the properties that must hold for any successful run, and for the one property that
# must hold for the committed target - that a contract which calls another contract
# yields at least one verified `INVOCATES` edge. What it deliberately does not assert is
# anything a live network changes under it: a ledger number, a transaction hash, an event
# count, a dependency's identity. What it catches is the class of defect a mock cannot:
# an endpoint that moved, a response shape that changed, a passphrase transcribed
# wrongly, or - the reason this test exists at all - the cross-contract call recovery
# quietly returning nothing while every mocked suite stayed green.
#
# The target is committed in `scripts/live-target.env` rather than required from a
# repository variable. The variable was never set, so this job used to print a notice and
# succeed without analysing anything: a scheduled green run that checked nothing.
on:
  schedule:
    # 06:00 UTC on Mondays, so a drift is noticed at the start of a week rather than
    # in the middle of a release.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      contract:
        description: The contract to analyse. Defaults to the committed live target.
        required: false
        type: string
      network:
        description: futurenet or testnet.
        required: false
        default: testnet
        type: choice
        options: [testnet, futurenet]

permissions:
  contents: read

concurrency:
  group: testnet-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: read-only analysis on a live network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release -p amasario-cli

      - name: Smoke test
        env:
          AMASARIO_BIN: ${{ github.workspace }}/target/release/amasario
          # Kept so the run is inspectable rather than only pass/fail. Without this the
          # script's scratch directory is removed on exit and the upload below would
          # find nothing, which is what the previous version of this job did.
          AMASARIO_ARTIFACTS: ${{ github.workspace }}/artifacts
          # A dispatch may name another contract. An empty value falls through to the
          # committed target, so the scheduled run never depends on an input.
          DISPATCH_CONTRACT: ${{ inputs.contract }}
        run: |
          set -euo pipefail
          network="${{ inputs.network }}"
          if [ -n "${DISPATCH_CONTRACT}" ]; then
            "${GITHUB_WORKSPACE}/scripts/test-testnet.sh" "${DISPATCH_CONTRACT}" "${network:-testnet}"
          else
            "${GITHUB_WORKSPACE}/scripts/test-testnet.sh" "" "${network:-testnet}"
          fi

      - name: Upload the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-smoke
          path: artifacts/
          if-no-files-found: warn

  # A network that answers with the wrong passphrase must be refused. That check is the
  # reason a wrong endpoint produces a clear error rather than an analysis of a chain
  # nobody chose, and it is the one property of the network layer that can be verified
  # without a contract to analyse - so it runs whether or not one is configured.
  identity:
    name: a wrong endpoint is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release -p amasario-cli

      - name: Point testnet's passphrase at Futurenet's endpoint
        run: |
          set -euo pipefail
          # The two chains have different passphrases, so this must fail as a network
          # error rather than producing an analysis of Futurenet labelled testnet.
          set +e
          output="$(./target/release/amasario inspect \
            --contract CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4 \
            --network testnet \
            --rpc https://rpc-futurenet.stellar.org 2>&1)"
          status=$?
          set -e
          echo "${output}"
          if [ "${status}" -ne 69 ]; then
            echo "expected the passphrase mismatch to be a network failure (69), got ${status}" >&2
            exit 1
          fi
          if ! printf '%s' "${output}" | grep -qi 'passphrase\|network'; then
            echo "the error must name the network identity as the cause" >&2
            exit 1
          fi
