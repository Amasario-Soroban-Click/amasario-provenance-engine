name: Fuzz

# Fuzzing on a schedule rather than on every pull request.
#
# The trade is deliberate: a fuzz run is only as good as the time it is given, and a
# ninety-second run on a pull request finds shallow defects while costing every
# contributor two minutes. A longer scheduled run finds the deep ones, and the corpus it
# accumulates is cached, so each run starts from everything previous runs discovered.
#
# The targets exercise the paths where malformed input is expected rather than
# hypothetical: a hostile RPC response, a corrupt snapshot, a hand-edited profile, a
# crafted WebAssembly module. The invariant every target checks is the same - a bad input
# produces a classified error, never a panic and never an unbounded loop.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz each target.
        required: false
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The check looks for the marker `cargo fuzz` itself requires - `cargo-fuzz = true`
      # under `[package.metadata]` in `fuzz/Cargo.toml` - rather than for a directory or a
      # file name. A layout that has the marker is runnable and one that does not is not,
      # whatever the files are called, so checking for the marker asks the same question
      # cargo-fuzz asks.
      #
      # The previous check looked for a `fuzz_targets` directory that this repository did
      # not have, set `run` to false, and skipped every step below, so the scheduled job
      # went green without fuzzing anything. The suite it was supposed to protect is the
      # one the security policy points at when it promises a malformed module or a hostile
      # RPC response produces a classified error rather than a panic.
      - name: Decide whether there are targets to run
        id: targets
        run: |
          set -euo pipefail
          if grep -qs '^cargo-fuzz *= *true' fuzz/Cargo.toml; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            grep -n '^cargo-fuzz *= *true' fuzz/Cargo.toml
          else
            echo "::notice title=No fuzz targets::fuzz/Cargo.toml carries no cargo-fuzz \
          marker; nothing to run. This is reported rather than passed silently."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install cargo-fuzz
        if: steps.targets.outputs.run == 'true'
        run: cargo install cargo-fuzz --locked

      # `cargo fuzz` drives `-Zsanitizer`, which is a nightly-only flag, and refuses to
      # run on the toolchain `rust-toolchain.toml` pins. Without this step the job would
      # have failed on its first target - which is why the two defects here had to be
      # fixed together: the guard meant the failure was never reached.
      - name: Install the nightly toolchain cargo-fuzz requires
        if: steps.targets.outputs.run == 'true'
        run: rustup toolchain install nightly --profile minimal

      - name: Restore the accumulated corpus
        if: steps.targets.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz every target
        if: steps.targets.outputs.run == 'true'
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          set -euo pipefail
          # This runs from the repository root, and that is required rather than tidy:
          # `cargo fuzz` resolves `fuzz/` relative to the working directory, so running it
          # from inside `fuzz/` makes it look for `fuzz/fuzz/Cargo.toml` and fail with
          # "could not read the manifest file". The step used to `cd fuzz` first.
          #
          # The target list is captured and checked before it is iterated, because an
          # empty list is the failure this step cannot afford to report as a success: a
          # loop over an empty expansion runs no iterations and exits zero, which is how
          # this job would have stayed green after the layout was made runnable but before
          # `cargo fuzz list` was found to return nothing.
          targets="$(cargo +nightly fuzz list)"
          if [ -z "${targets}" ]; then
            echo "::error title=No targets to fuzz::cargo fuzz listed no targets, so this \
          job would have passed without fuzzing anything. Expected the five targets \
          declared in fuzz/Cargo.toml."
            exit 1
          fi
          echo "targets: $(printf '%s' "${targets}" | tr '\n' ' ')"
          # A fuzzer that finds a crash leaves the artifact in fuzz/artifacts, and the
          # workflow uploads it below rather than swallowing it: the reproducer is the
          # useful output, not the exit code.
          while IFS= read -r target; do
            [ -z "${target}" ] && continue
            echo "==> fuzzing ${target} for ${SECONDS_PER_TARGET}s"
            cargo +nightly fuzz run "${target}" -- -max_total_time="${SECONDS_PER_TARGET}" \
              -rss_limit_mb=4096
          done <<< "${targets}"

      - name: Upload any crash artifacts
        if: failure() && steps.targets.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
