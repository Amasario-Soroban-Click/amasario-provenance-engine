name: CI

# The full gate. The other workflows are focused subsets of this one, so a
# contributor who runs `cargo lint`, `cargo test-all` and
# `cargo fmt --all -- --check` locally has run what this job runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets: the engine reads public network data and holds no credentials, and
# the workflow permission block is what keeps that true as steps are added.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that CI tolerates is a warning nobody fixes.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format · clippy · test · doc · conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The normative specification, checked out so that the conformance test has
      # something to compare the engine's vocabularies against. Without it the
      # engine's claim to *consume* the specification would be an assertion rather
      # than a check.
      #
      # A private specification repository additionally needs a token with read
      # access to it; `github.token` covers the public case, which is what a public
      # engine requires.
      - name: Check out the normative specification
        uses: actions/checkout@v7
        with:
          repository: Amasario-Soroban-Click/amasario-provenance-spec
          ref: main
          path: .amasario-spec

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # The shell scripts are part of the product surface: `scripts/run-ci.sh` is what a
      # contributor runs locally, `scripts/install.sh` is the documented way in, and
      # `scripts/test-testnet.sh` is what the scheduled live test runs. A script that
      # only ever gets executed by CI is still code that ships, so it is linted at the
      # strictest severity rather than trusted. `shellcheck` ships on the runner image.
      - name: Shell scripts
        run: shellcheck --severity=style scripts/*.sh scripts/*.env

      # The workflows and the composite action are code, and a workflow that does not
      # parse is a gate that silently stops running: the failure mode is a green
      # repository, not a red one. `actionlint` catches that class, along with the
      # expression mistakes a shell cannot see - referencing `needs.x.outputs.y` from a
      # job that does not declare `needs: x` is valid YAML, valid GitHub syntax and an
      # empty string at run time, which is how the release job came to cut its notes
      # from an empty version.
      #
      # Pinned by version and by digest rather than fetched unpinned, because a check on
      # the supply chain should not itself be the weakest link in it.
      - name: Workflows and the composite action
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          ./actionlint -color .github/workflows/*.yml

      # Every one of these commands names `--workspace`, and that is not a style
      # preference. The root manifest is a package as well as a workspace - it holds the
      # benchmarks - so a bare `cargo test`, `cargo clippy` or `cargo doc` in this
      # directory operates on the root package only. The root package has no library and
      # no binary, so a bare `cargo test` builds nothing, runs nothing and exits zero: a
      # green step that verified none of the twelve crates. A bare `cargo test --doc`
      # fails outright with `no library targets found in package `amasario``. Neither
      # outcome is visible from the workflow's status, which is exactly why the flag is
      # spelled out on each command rather than left to the default.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The integration suites run the `amasario` binary and locate it relative to their
      # own test executable, so it has to exist before they run. `cargo test` does not
      # produce it: a binary is built as a test harness under `target/<profile>/deps/`,
      # not as the runnable artefact in `target/<profile>/`. Building the workspace first
      # is therefore part of running the suite, not an optimisation - without it the two
      # CLI suites in `integration-tests/snapshots` fail with the message that names this
      # command. `scripts/run-ci.sh` has always built before testing; this job did not.
      - name: Building
        run: cargo build --workspace --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      # The examples under `examples/` are executable documentation, so they are checked
      # rather than trusted. The offline ones are re-run and compared against their
      # committed output; the endpoint ones are pointed at an address that refuses
      # connections, where they must exit 69 rather than 2 - which is what proves every
      # flag in the documented command line still parses.
      - name: Examples
        run: scripts/check-examples.sh

      # The conformance checks are ignored by default because they need the
      # specification checkout, which this job provides. Running them here is what
      # makes the comparison enforced rather than merely available.
      - name: Specification conformance
        env:
          AMASARIO_SPEC_DIR: ${{ github.workspace }}/.amasario-spec
        run: cargo test -p amasario-core --all-features -- --include-ignored

      # `scripts/validate-profile.sh` was reachable only from `scripts/run-ci.sh`, and
      # `run-ci.sh` is documented in `CONTRIBUTING.md` as mirroring this workflow step for
      # step. It did not: the profile check existed at a contributor's discretion and
      # nowhere in CI, so a profile naming a taxonomy file, a relationship id or a network
      # type that the specification had moved on from would drift unnoticed until a
      # consumer acted on a term that no longer meant what it used to. The profile's own
      # header states the profile is validated - that statement is only true if something
      # validates it, and this is that something.
      #
      # It needs the specification checkout the conformance step already makes, so it runs
      # here rather than in a job of its own.
      - name: Profile validation
        env:
          AMASARIO_SPEC_DIR: ${{ github.workspace }}/.amasario-spec
        run: scripts/validate-profile.sh

      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps --all-features --document-private-items

      - name: Documentation examples compile
        run: cargo test --workspace --all-features --doc
