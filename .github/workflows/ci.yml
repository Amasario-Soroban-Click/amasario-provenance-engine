name: CI

# The full gate. The other workflows are focused subsets of this one, so a
# contributor who runs `cargo lint`, `cargo test-all` and
# `cargo fmt --all -- --check` locally has run what this job runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets: the engine reads public network data and holds no credentials, and
# the workflow permission block is what keeps that true as steps are added.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that CI tolerates is a warning nobody fixes.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format · clippy · test · doc · conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The normative specification, checked out so that the conformance test has
      # something to compare the engine's vocabularies against. Without it the
      # engine's claim to *consume* the specification would be an assertion rather
      # than a check.
      #
      # A private specification repository additionally needs a token with read
      # access to it; `github.token` covers the public case, which is what a public
      # engine requires.
      - name: Check out the normative specification
        uses: actions/checkout@v5
        with:
          repository: Amasario-Soroban-Click/amasario-provenance-spec
          ref: main
          path: .amasario-spec

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # The shell scripts are part of the product surface: `scripts/run-ci.sh` is what a
      # contributor runs locally, `scripts/install.sh` is the documented way in, and
      # `scripts/test-testnet.sh` is what the scheduled live test runs. A script that
      # only ever gets executed by CI is still code that ships, so it is linted at the
      # strictest severity rather than trusted. `shellcheck` ships on the runner image.
      - name: Shell scripts
        run: shellcheck --severity=style scripts/*.sh scripts/*.env

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The examples under `examples/` are executable documentation, so they are checked
      # rather than trusted. The offline ones are re-run and compared against their
      # committed output; the endpoint ones are pointed at an address that refuses
      # connections, where they must exit 69 rather than 2 - which is what proves every
      # flag in the documented command line still parses.
      - name: Examples
        run: scripts/check-examples.sh

      # The conformance checks are ignored by default because they need the
      # specification checkout, which this job provides. Running them here is what
      # makes the comparison enforced rather than merely available.
      - name: Specification conformance
        env:
          AMASARIO_SPEC_DIR: ${{ github.workspace }}/.amasario-spec
        run: cargo test -p amasario-core --all-features -- --include-ignored

      - name: Documentation builds without warnings
        run: cargo doc --no-deps --document-private-items

      - name: Documentation examples compile
        run: cargo test --doc
