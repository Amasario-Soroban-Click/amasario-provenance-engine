# Pinned rather than floating. A provenance engine's output is meant to be
# reproducible, and a compiler change that alters floating-point layout, hash
# ordering or diagnostics is exactly the kind of variation the specification's
# determinism requirement is written against. Contributors get the same toolchain
# as CI without having to read a workflow file.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
targets = ["wasm32-unknown-unknown"]
