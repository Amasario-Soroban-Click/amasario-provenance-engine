[package]
name = "amasario-dependency-fuzzer"
description = "Fuzzes candidate classification, resolution and the transitive closure."
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "dependency-fuzzer"
path = "src/main.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"

amasario-core = { path = "../../crates/amasario-core" }
amasario-dependency = { path = "../../crates/amasario-dependency" }

[lints.rust]
unsafe_code = "forbid"
