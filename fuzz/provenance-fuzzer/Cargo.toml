[package]
name = "amasario-provenance-fuzzer"
description = "Fuzzes the module decoder and digest verification the provenance chain rests on."
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "provenance-fuzzer"
path = "src/main.rs"
# A fuzz target is not a test, a bench or a doc example; saying so keeps `cargo test`
# in this workspace from running the fuzzer as though it were one.
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
serde_json = "1"

amasario-contract = { path = "../../crates/amasario-contract" }
amasario-core = { path = "../../crates/amasario-core" }
amasario-provenance = { path = "../../crates/amasario-provenance" }

[lints.rust]
unsafe_code = "forbid"
