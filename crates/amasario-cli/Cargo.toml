[package]
name = "amasario-cli"
description = "The Amasario command-line interface: inspect, provenance, dependency, graph, impact, snapshot, diff, verify, report and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# The binary is what a user installs. It is named `amasario` rather than after the
# crate because the crate name describes the layer and the binary name is the
# product.
[[bin]]
name = "amasario"
path = "src/main.rs"

[dependencies]
amasario-contract.workspace = true
amasario-core.workspace = true
amasario-dependency.workspace = true
amasario-evidence.workspace = true
amasario-export.workspace = true
amasario-graph.workspace = true
amasario-impact.workspace = true
amasario-network.workspace = true
amasario-provenance.workspace = true
amasario-report.workspace = true
amasario-snapshot.workspace = true

clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# The composite action and the workflows are checked against the command surface this
# crate declares, so a table in this crate's tests can read one. A test that rebuilt a
# YAML parser to avoid the dependency would be testing the parser instead.
serde_norway.workspace = true
tempfile.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
