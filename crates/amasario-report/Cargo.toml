[package]
name = "amasario-report"
description = "Report generation for Amasario: the specification's report document, rendered as JSON, Markdown, DOT and JUnit without ever merging an observation into an inference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The report is assembled from the layers that produced the analysis, so it depends on
# them rather than restating their types. `amasario-snapshot` is deliberately absent:
# a snapshot contains a report-shaped summary of an analysis, and depending on it here
# would point the arrow the wrong way.
amasario-core = { workspace = true }
amasario-dependency = { workspace = true }
amasario-evidence = { workspace = true }
amasario-export = { workspace = true }
amasario-graph = { workspace = true }
amasario-impact = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
